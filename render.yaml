# Despliegue del backend en Render (plan gratuito, HTTPS automático).
# En Render: New → Blueprint → elegir este repositorio. Pedirá los valores marcados sync: false.
services:
  - type: web
    name: clasificador-iot-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DEVICE_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: VISION_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: PROVIDER_TIMEOUT_MS
        value: "8000"
      - key: UMBRAL_CONFIANZA
        value: "0.70"
